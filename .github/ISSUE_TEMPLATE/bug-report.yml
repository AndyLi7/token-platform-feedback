name: Bug report
description: Report an error or unexpected behavior found while testing Token Platform
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Token Platform. This repository and its issues are public. Do not submit full email addresses, API keys, passwords, cookies, access tokens, or other sensitive credentials.
  - type: input
    id: account
    attributes:
      label: Masked test account identifier
      description: Provide only enough masked information to help locate the request. Do not enter a full email address.
      placeholder: an***@example.com
    validations:
      required: true
  - type: input
    id: occurred_at
    attributes:
      label: Time of occurrence
      description: Include the date, time, and time zone so that the request can be located in the logs.
      placeholder: 2026-08-19 14:30 UTC+8
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model or feature
      placeholder: bytedance/seedance-2.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps required to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: parameters
    attributes:
      label: Redacted request parameters
      description: Remove all API keys, passwords, cookies, access tokens, full email addresses, and other sensitive values.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: Request log ID
      description: If a request ID is available in the user logs, enter it here. Do not enter an API key.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Drag screenshots here after redacting account details, balances, keys, and other sensitive information.